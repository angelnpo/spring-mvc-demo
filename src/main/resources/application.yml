server:
    port: 8080
    servlet:
        context-path: /spring-mvc-demo
        session:
            timeout: 60m
---
logging:
  level:
    root: DEBUG
    org:
      springframework:
        security: TRACE
---
spring:
    application:
        name: spring-mvc-demo
    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://angelnpo:5432/DBDEV
        username: admin
        password: sasa
        hikari:
            connection-test-query: SELECT 1
            maximum-pool-size: 100
            connection-timeout: 30000
            max-lifetime: 300000 # 5 min
            minimumIdle: 20 # mínimo de conexiones inactivas
            idleTimeout: 300000 #Esto evita conexiones “zombi” y reduce validaciones fallidas.
    jpa:
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                default_schema: spring_mvc_demo
                order_inserts: true
                order_updates: true
                generate_statistics: false
                hbm2ddl:
                  create_namespaces: true
                id:
                    batch_versioned_data: true
#                    new_generator_mappings: false # true for increment by 50 or (allocationSize property in mapping), false for increment one by one
                jdbc:
                    batch_size: 50
                    batch_versioned_data: true
        hibernate:
            ddl-auto: update
    sql:
        init-mode: always
        init-schema-location: classpath:db/schema.sql
