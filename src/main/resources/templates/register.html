<!DOCTYPE html>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    lang="es"
>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="description" content="Demo application spring boot" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Web Demo</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <div class="container py-4 col-md-6">
            <div class="card">
                <div class="card-header">Register user</div>

                <div class="card-body">
                    <div
                        th:if="${success}"
                        class="alert alert-success"
                        role="alert"
                        th:text="${success}"
                    ></div>
                    <div
                        th:if="${error}"
                        class="alert alert-danger"
                        role="alert"
                        th:text="${error}"
                    ></div>

                    <form
                        class="row g-3 needs-validation"
                        novalidate
                        th:action="@{/register}"
                        th:object="${userDTO}"
                        method="post"
                    >
                        <div class="col-md-4">
                            <label for="username" class="form-label"
                                >User name</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                required
                                th:field="*{username}"
                            />
                            <small
                                class="form-text text-danger"
                                th:errors="*{username}"
                            ></small>
                        </div>
                        <div class="col-md-4">
                            <label for="firstName" class="form-label"
                                >First name</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="firstName"
                                name="firstName"
                                th:field="*{firstName}"
                            />
                        </div>
                        <div class="col-md-4">
                            <label for="lastName" class="form-label"
                                >Last name</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="lastName"
                                name="lastName"
                                th:field="*{lastName}"
                            />
                        </div>

                        <div class="col-md-4">
                            <label
                                for="email"
                                class="form-label"
                                >Email</label
                            >
                            <div class="input-group has-validation">
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    th:field="*{email}"
                                    aria-describedby="inputGroupPrepend"
                                    required
                                />
                                <small
                                    class="form-text text-danger"
                                    th:errors="*{email}"
                                ></small>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="password" class="form-label"
                                >Password</label
                            >
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                th:field="*{password}"
                                required
                            />
                            <small
                                class="form-text text-danger"
                                th:errors="*{password}"
                            ></small>
                        </div>

                        <div class="col-md-4">
                            <label for="adminRole" class="form-label"
                                >Role
                            </label>
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="adminRole"
                                    id="adminRole"
                                    th:field="*{role}"
                                    value="ADMIN"
                                    required
                                />
                                <label class="form-check-label" for="adminRole"
                                    >ADMIN</label
                                >
                            </div>
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="userRole"
                                    id="userRole"
                                    th:field="*{role}"
                                    value="USER"
                                    required
                                />
                                <label class="form-check-label" for="userRole">
                                    USER
                                </label>
                            </div>
                        </div>

                        <div class="col-12">
                            <button class="btn btn-primary" type="submit">
                                Register
                            </button>
                            <p class="pt-3">
                                <a
                                    class="link-offset-2 link-underline link-underline-opacity-0"
                                    th:href="@{/login}"
                                    >Sign in</a
                                >
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
            integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
            crossorigin="anonymous"
        ></script>

        <script th:src="@{/js/app.js}"></script>
        <script th:if="${success}">
            showMessage();
        </script>
    </body>
</html>
