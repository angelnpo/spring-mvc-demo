<!DOCTYPE html>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    lang="es"
>
    <head th:replace="layout/layout :: head"></head>

    <body>
        <div class="container py-4 col-6">
            <div class="card">
                <div class="card-header">Login</div>
                <div class="card-body">
                    <div
                        th:if="${param.error}"
                        class="alert alert-danger"
                        role="alert"
                    >
                        Incorrect credentials. Please try again.
                    </div>
                    <div
                        th:if="${param.logout}"
                        class="alert alert-success"
                        role="alert"
                    >
                        You have successfully logged out.
                    </div>

                    <main>
                        <form th:action="@{/login}" method="post">
                            <div class="row mb-3">
                                <label
                                    for="email"
                                    class="col-sm-2 col-form-label"
                                    >Email</label
                                >
                                <div class="col-sm-10">
                                    <input
                                        id="email"
                                        name="email"
                                        type="email"
                                        class="form-control"
                                    />
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label
                                    for="password"
                                    class="col-sm-2 col-form-label"
                                    >Password</label
                                >
                                <div class="col-sm-10">
                                    <input
                                        id="password"
                                        name="password"
                                        type="password"
                                        class="form-control"
                                    />
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                Sign in
                            </button>
                            <p class="pt-3">
                                <a
                                    class="link-offset-2 link-underline link-underline-opacity-0"
                                    th:href="@{/register}"
                                    >Sign up</a
                                >
                            </p>
                        </form>
                    </main>
                </div>
            </div>
        </div>
    </body>
</html>
